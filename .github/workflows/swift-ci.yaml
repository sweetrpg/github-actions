name: Swift CI

on:
  workflow_call:
    inputs:
      swift-version:
        description: "Swift toolchain version to build and test with."
        type: string
        default: "6.0"
      matrix:
        description: "JSON array of `{name, os}` matrix entries to validate on. Defaults to Linux."
        type: string
        default: >-
          [{"name": "Linux", "os": "ubuntu-latest"}]
      test-args:
        description: "Extra arguments appended to the `swift test` invocation."
        type: string
        default: ""
      publish-coverage:
        description: "Publish the coverage report to GitHub Pages. Best-effort: a coverage
          export failure warns but does not fail CI, since the exact binary/profile paths
          Swift emits vary by platform and toolchain version."
        type: boolean
        default: false
      coverage-threshold:
        description: "Minimum total coverage percentage. Warn-only (continue-on-error) -
          does not block merges."
        type: string
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate on ${{ matrix.entry.name }}

    runs-on: ${{ matrix.entry.os }}

    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Swift
        id: install_swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ inputs.swift-version }}

      - name: Check formatting
        id: check_fmt
        run: |
          swift format lint --recursive --strict Sources Tests

      - name: Build
        id: build
        run: |
          swift build --build-tests

      - name: Test
        id: test
        run: |
          swift test --enable-code-coverage ${{ inputs.test-args }}

      # Best-effort: locates the .xctest binary swift test just produced and exports an
      # lcov report plus an HTML report (both via llvm-cov, already part of the Swift
      # toolchain - no extra install needed, unlike genhtml/lcov which aren't preinstalled
      # on the runner image). Swift's exact output layout has moved between toolchain
      # versions before, so a failure here warns instead of failing the whole job - it's
      # diagnostic tooling, not the test itself.
      - name: Export coverage
        id: coverage
        continue-on-error: true
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          XCTEST_BIN=$(find "$BIN_PATH" -name "*.xctest" -type f | head -n1)
          if [ -z "$XCTEST_BIN" ]; then
            XCTEST_BIN=$(find "$BIN_PATH" -name "*.xctest" -type d | head -n1)/Contents/MacOS/*
          fi
          PROFDATA="$BIN_PATH/codecov/default.profdata"
          echo "xctest_bin=$XCTEST_BIN" >> "$GITHUB_OUTPUT"
          echo "profdata=$PROFDATA" >> "$GITHUB_OUTPUT"
          mkdir -p coverage
          llvm-cov export -format=lcov "$XCTEST_BIN" \
            -instr-profile="$PROFDATA" > coverage/coverage.lcov
          llvm-cov show "$XCTEST_BIN" -instr-profile="$PROFDATA" \
            -format=html -output-dir=coverage

      - name: Coverage summary
        id: coverage_summary
        if: steps.coverage.outcome == 'success'
        continue-on-error: true
        run: |
          echo "## Swift coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          llvm-cov report "${{ steps.coverage.outputs.xctest_bin }}" \
            -instr-profile="${{ steps.coverage.outputs.profdata }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        id: upload_coverage
        if: steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.entry.name }}
          path: coverage/

      # Separate step, after the summary/artifact are already generated, so a
      # below-threshold result never prevents those from being produced. Warn-only:
      # continue-on-error means this never blocks the job, only shows as a flagged step.
      - name: Coverage threshold
        id: coverage_threshold
        if: steps.coverage.outcome == 'success'
        continue-on-error: true
        run: |
          read -r LF LH < <(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{print lf, lh}' coverage/coverage.lcov)
          PCT=$(awk -v lf="$LF" -v lh="$LH" 'BEGIN { if (lf>0) printf "%.2f", (lh/lf)*100; else print "0.00" }')
          echo "Coverage: ${PCT}% (threshold: ${{ inputs.coverage-threshold }}%)"
          awk -v pct="$PCT" -v threshold="${{ inputs.coverage-threshold }}" \
            'BEGIN { exit !(pct+0 >= threshold+0) }'

      - name: Publish coverage
        if: inputs.publish-coverage && steps.coverage.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage

      # Push-only: PR runs shouldn't write commits. Writes a shields.io endpoint-schema
      # JSON badge and commits it back so READMEs can reference it via
      # img.shields.io/endpoint. continue-on-error since a badge push racing another
      # push to the same branch is a rejected, not fatal, non-fast-forward.
      - name: Coverage badge
        id: coverage_badge
        if: github.event_name == 'push' && steps.coverage.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r LF LH < <(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{print lf, lh}' coverage/coverage.lcov)
          PCT=$(awk -v lf="$LF" -v lh="$LH" 'BEGIN { if (lf>0) printf "%.2f", (lh/lf)*100; else print "0.00" }')
          COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > .github/badges/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --cached --quiet; then
            echo "Badge unchanged, skipping"
            exit 0
          fi
          BRANCH="coverage-badge/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: update coverage badge [skip ci]"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "chore: update coverage badge" \
            --body "Automated coverage badge update ($PCT%)." \
            --base "${{ github.ref_name }}" --head "$BRANCH")
          gh pr merge "$PR_URL" --squash --auto --delete-branch
