name: Rust Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0. Only used for manual dispatch by the caller."
        type: string
        default: ""
      test-args:
        description: "Arguments for the pre-publish `cargo test` invocation."
        type: string
        default: "--all-features"
      publish-to-crates-io:
        description: >
          Publish the crate to crates.io. Set false for a deployable service with no crates.io
          presence of its own (e.g. a binary shipped only as a container image via
          docker-build.yml + argocd-update-deployment.yaml) - true by default to preserve
          existing library-crate callers (common.rs, model-core.rs, etc.).
        type: boolean
        default: true
      trusted-publishing:
        description: >
          Use crates.io OIDC trusted publishing (rust-lang/crates-io-auth-action) instead of
          a static token. Requires the crate to already exist on crates.io and be configured
          as a trusted publisher there. Ignored when publish-to-crates-io is false.
        type: boolean
        default: true
      merge-back-branch:
        description: "Branch to merge the release ref back into after publishing (e.g. develop). Empty to skip."
        type: string
        default: "develop"
    secrets:
      CRATES_API_KEY:
        description: "crates.io API token. Required only when trusted-publishing is false."
        required: false
      SRPG_CI_APP_ID:
        description: "Required only when merge-back-branch is non-empty."
        required: false
      SRPG_CI_PRIVATE_KEY:
        description: "Required only when merge-back-branch is non-empty."
        required: false

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: resolve_tag
        run: |
          echo "tag=${{ inputs.tag != '' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}
          fetch-depth: 0 # full history required for git-cliff
          fetch-tags: true
          show-progress: true
          submodules: recursive

      - name: Install Rust
        id: install_rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        id: rust_cache
        uses: Swatinem/rust-cache@v2

      - name: Install git-cliff
        id: install_git_cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Test
        id: test
        run: |
          cargo test ${{ inputs.test-args }}

      - name: Authenticate with crates.io (trusted publishing)
        id: crates_io_auth
        if: inputs.publish-to-crates-io && inputs.trusted-publishing
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io (trusted publishing)
        if: inputs.publish-to-crates-io && inputs.trusted-publishing
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          cargo publish

      - name: Publish to crates.io (token)
        if: inputs.publish-to-crates-io && !inputs.trusted-publishing
        run: |
          cargo publish --token ${{ secrets.CRATES_API_KEY }}

      - name: Generate changelog for this tag
        id: changelog
        run: |
          git-cliff --current --strip header -o RELEASE_NOTES.md

      - name: Create GitHub Release
        id: github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          body_path: RELEASE_NOTES.md

      - name: Generate token
        id: ci_token
        if: inputs.merge-back-branch != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SRPG_CI_APP_ID }}
          private-key: ${{ secrets.SRPG_CI_PRIVATE_KEY }}

      # Uses the "Merge a branch" REST API instead of a local `git merge` + `git push`: the
      # merge-back branch's ruleset requires every commit to be signed, and a merge commit built
      # by a local git client has no signature attached. A merge created server-side through this
      # endpoint is authored and signed by GitHub itself (the same way a PR's merge button
      # produces a "Verified" commit), so it satisfies the rule without needing a signing key in
      # CI. It also sidesteps a required status check on the merge-back branch: a brand new merge
      # commit has never existed on GitHub before, so no check could have run against it yet --
      # pushing as the CI app (a configured bypass actor) skips that unsatisfiable check instead
      # of racing it. See go-release.yaml's identical step for the same fix applied there first.
      - name: Merge back to ${{ inputs.merge-back-branch }}
        id: merge_back
        if: inputs.merge-back-branch != ''
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          gh api repos/${{ github.repository }}/merges \
            -f base=${{ inputs.merge-back-branch }} \
            -f head=master \
            -f commit_message="chore(release): merge master into ${{ inputs.merge-back-branch }} after ${{ steps.resolve_tag.outputs.tag }}"
