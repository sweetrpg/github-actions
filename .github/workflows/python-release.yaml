name: Python Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0. Only used for manual dispatch by the caller."
        type: string
        default: ""
      python-version:
        description: "Python version to test with."
        type: string
        default: "3.14"
      install-command:
        description: "Command installing test dependencies + the package itself before testing."
        type: string
        default: "uv pip install -r requirements/tests.txt -e ."
      test-command:
        description: "Command re-verifying the tagged commit before publishing a GitHub Release."
        type: string
        default: "python -m pytest tests"
      merge-back-branch:
        description: "Branch to merge the release ref back into after publishing (e.g. develop). Empty to skip."
        type: string
        default: "develop"
      publish-to-pypi:
        description: "Build sdist/wheel and publish to PyPI."
        type: boolean
        default: false
      pypi-trusted-publishing:
        description: >
          Authenticate to PyPI via OIDC Trusted Publishing instead of secrets.PYPI_TOKEN.
          Requires a Trusted Publisher configured on the PyPI project (Publishing settings:
          owner/repo = this repo, workflow filename = the caller's own .yml/.yaml under
          .github/workflows/, matching exactly - PyPI checks the calling workflow's path, not
          this reusable one's). No effect unless publish-to-pypi is also true.
        type: boolean
        default: false
    secrets:
      SRPG_CI_APP_ID:
        required: true
      SRPG_CI_PRIVATE_KEY:
        required: true
      PYPI_TOKEN:
        required: false

permissions:
  contents: write
  # Unused unless a caller sets pypi-trusted-publishing: true - granting it here is a no-op
  # otherwise, but the reusable workflow can't request per-input permissions (permissions:
  # blocks aren't conditional), and a caller's own permissions: block is a ceiling that would
  # otherwise silently deny this even when requested.
  id-token: write

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Generate token
        id: ci_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SRPG_CI_APP_ID }}
          private-key: ${{ secrets.SRPG_CI_PRIVATE_KEY }}

      - name: Resolve tag
        id: resolve_tag
        run: |
          echo "tag=${{ inputs.tag != '' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}
          fetch-depth: 0 # full history required for git-cliff
          fetch-tags: true
          show-progress: true
          submodules: recursive

      - name: Install Python
        id: install_python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install git-cliff
        id: install_git_cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Build sdist/wheel
        id: build
        if: inputs.publish-to-pypi
        run: |
          uv pip install build
          python -m build

      # Trusted Publishing (OIDC): omit user/password entirely - gh-action-pypi-publish
      # authenticates via the job's OIDC token when none is given, and PyPI validates that
      # token against the project's configured Trusted Publisher (repo + this exact caller
      # workflow filename). Token-based auth (the default): explicit password disables OIDC
      # even if id-token: write is granted, per the action's own precedence.
      - name: Publish to PyPI (trusted publishing)
        id: publish_pypi_trusted
        if: inputs.publish-to-pypi && inputs.pypi-trusted-publishing
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI (API token)
        id: publish_pypi_token
        if: inputs.publish-to-pypi && !inputs.pypi-trusted-publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Generate changelog for this tag
        id: changelog
        run: |
          git-cliff --current --strip header -o RELEASE_NOTES.md

      - name: Create GitHub Release
        id: github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          body_path: RELEASE_NOTES.md

      # Uses the "Merge a branch" REST API rather than a local `git merge` + `git push` - see
      # go-release.yaml's identical step for why (signed-commit requirement on the merge-back
      # branch, and a bypass actor sidestepping an unsatisfiable status check on a commit that
      # never existed before this run).
      - name: Merge back to ${{ inputs.merge-back-branch }}
        id: merge_back
        if: inputs.merge-back-branch != ''
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          gh api repos/${{ github.repository }}/merges \
            -f base=${{ inputs.merge-back-branch }} \
            -f head=master \
            -f commit_message="chore(release): merge master into ${{ inputs.merge-back-branch }} after ${{ steps.resolve_tag.outputs.tag }}"
