name: Go CI

on:
  workflow_call:
    inputs:
      mongodb-version:
        description: "MongoDB version to start for DB-backed tests. Empty to skip."
        type: string
        default: ""
      test-env:
        description: "JSON object of extra env vars for the test step (e.g. TEST_DB_URI)."
        type: string
        default: "{}"
      matrix:
        description: "JSON array of `{name, os}` matrix entries to validate on. Defaults to Linux."
        type: string
        default: >-
          [{"name": "Linux", "os": "ubuntu-latest"}]
      publish-coverage:
        description: "Publish the coverage report to GitHub Pages."
        type: boolean
        default: true
      coverage-threshold:
        description: "Minimum total coverage percentage. Warn-only (continue-on-error) -
          does not block merges."
        type: string
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate on ${{ matrix.entry.name }}

    runs-on: ${{ matrix.entry.os }}

    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Go
        id: install_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        id: check_fmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        id: vet
        run: |
          go vet ./...

      - name: Lint
        id: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: start-mongodb
        if: inputs.mongodb-version != ''
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ inputs.mongodb-version }}

      - name: Test
        id: test
        env: ${{ fromJson(inputs.test-env) }}
        run: |
          go test -race -coverprofile coverage.out ./...
          mkdir coverage
          go tool cover -html coverage.out -o coverage/coverage.html

      - name: Coverage summary
        id: coverage_summary
        run: |
          echo "## Go coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        id: upload_coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.entry.name }}
          path: coverage/

      # Separate step, after the summary/artifact are already generated, so a
      # below-threshold result never prevents those from being produced. Warn-only:
      # continue-on-error means this never blocks the job, only shows as a flagged step.
      - name: Coverage threshold
        id: coverage_threshold
        continue-on-error: true
        run: |
          PCT=$(go tool cover -func coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Coverage: ${PCT}% (threshold: ${{ inputs.coverage-threshold }}%)"
          awk -v pct="$PCT" -v threshold="${{ inputs.coverage-threshold }}" \
            'BEGIN { exit !(pct+0 >= threshold+0) }'

      - name: Publish coverage
        if: inputs.publish-coverage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage

      # Push-only: PR runs shouldn't open badge-update PRs of their own. Writes a
      # shields.io endpoint-schema JSON badge; if it changed, opens a small PR (target
      # branches are protected - no direct pushes allowed) and enables auto-merge, so it
      # lands once its own required checks pass. continue-on-error: badge updates are
      # best-effort, never worth failing the job over.
      - name: Coverage badge
        id: coverage_badge
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PCT=$(go tool cover -func coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > .github/badges/coverage.json
          if git diff --quiet -- .github/badges/coverage.json; then
            echo "Badge unchanged, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="coverage-badge/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add .github/badges/coverage.json
          git commit -m "chore: update coverage badge [skip ci]"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "chore: update coverage badge" \
            --body "Automated coverage badge update ($PCT%)." \
            --base "${{ github.ref_name }}" --head "$BRANCH")
          gh pr merge "$PR_URL" --squash --auto --delete-branch
