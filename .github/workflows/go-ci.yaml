name: Go CI

on:
  workflow_call:
    inputs:
      mongodb-version:
        description: "MongoDB version to start for DB-backed tests. Empty to skip."
        type: string
        default: ""
      test-env:
        description: "JSON object of extra env vars for the test step (e.g. TEST_DB_URI)."
        type: string
        default: "{}"
      matrix:
        description: "JSON array of `{name, os}` matrix entries to validate on. Defaults to Linux."
        type: string
        default: >-
          [{"name": "Linux", "os": "ubuntu-latest"}]
      publish-coverage:
        description: "Publish the coverage report to GitHub Pages."
        type: boolean
        default: true
      coverage-threshold:
        description: "Minimum total coverage percentage. Warn-only (continue-on-error) -
          does not block merges."
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate on ${{ matrix.entry.name }}

    runs-on: ${{ matrix.entry.os }}

    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Go
        id: install_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        id: check_fmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        id: vet
        run: |
          go vet ./...

      - name: Lint
        id: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: start-mongodb
        if: inputs.mongodb-version != ''
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ inputs.mongodb-version }}

      - name: Test
        id: test
        env: ${{ fromJson(inputs.test-env) }}
        run: |
          go test -race -coverprofile coverage.out ./...
          mkdir coverage
          go tool cover -html coverage.out -o coverage/coverage.html

      - name: Coverage summary
        id: coverage_summary
        run: |
          echo "## Go coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        id: upload_coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.entry.name }}
          path: coverage/

      # Separate step, after the summary/artifact are already generated, so a
      # below-threshold result never prevents those from being produced. Warn-only:
      # continue-on-error means this never blocks the job, only shows as a flagged step.
      - name: Coverage threshold
        id: coverage_threshold
        continue-on-error: true
        run: |
          PCT=$(go tool cover -func coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Coverage: ${PCT}% (threshold: ${{ inputs.coverage-threshold }}%)"
          awk -v pct="$PCT" -v threshold="${{ inputs.coverage-threshold }}" \
            'BEGIN { exit !(pct+0 >= threshold+0) }'

      - name: Publish coverage
        if: inputs.publish-coverage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage
