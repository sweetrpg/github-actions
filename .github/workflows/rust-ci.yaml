name: Rust CI

on:
  workflow_call:
    inputs:
      test-args:
        description: "Extra arguments appended to the primary `cargo test` invocation."
        type: string
        default: "--all-features"
      no-default-features-test:
        description: "Also run `cargo test --no-default-features`."
        type: boolean
        default: false
      doc-test:
        description: "Also run `cargo test --doc`."
        type: boolean
        default: false
      doc-build:
        description: "Also run `cargo doc --no-deps` with warnings as errors."
        type: boolean
        default: false
      matrix:
        description: >
          JSON array of `{name, os}` matrix entries to validate on. Defaults to Linux and
          Apple Silicon macOS.
        type: string
        default: >-
          [{"name": "Linux", "os": "ubuntu-latest"},
           {"name": "macOS (Apple Silicon)", "os": "macos-latest"}]
      coverage-threshold:
        description: "Minimum total coverage percentage. Warn-only (continue-on-error) -
          does not block merges."
        type: string
        default: "0"

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Validate on ${{ matrix.entry.name }}

    runs-on: ${{ matrix.entry.os }}

    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          show-progress: true
          submodules: recursive

      - name: Install Rust
        id: install_rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        id: rust_cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        id: check_fmt
        run: |
          cargo fmt --check

      - name: Clippy
        id: clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        id: test
        run: |
          cargo test ${{ inputs.test-args }}

      - name: Install cargo-tarpaulin
        id: install_tarpaulin
        if: matrix.entry.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Coverage (tarpaulin)
        id: coverage
        if: matrix.entry.os == 'ubuntu-latest'
        run: |
          mkdir -p coverage
          cargo tarpaulin --engine llvm --out Html --out Xml --output-dir coverage | tee coverage/tarpaulin-output.txt

      - name: Coverage summary
        id: coverage_summary
        if: matrix.entry.os == 'ubuntu-latest'
        run: |
          echo "## Rust coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/tarpaulin-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        id: upload_coverage
        if: matrix.entry.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.entry.name }}
          path: coverage/

      # Separate step, after the summary/artifact are already generated, so a
      # below-threshold result never prevents those from being produced. Warn-only:
      # continue-on-error means this never blocks the job, only shows as a flagged step.
      - name: Coverage threshold
        id: coverage_threshold
        if: matrix.entry.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
            | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+')
          PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
          echo "Coverage: ${PCT}% (threshold: ${{ inputs.coverage-threshold }}%)"
          awk -v pct="$PCT" -v threshold="${{ inputs.coverage-threshold }}" \
            'BEGIN { exit !(pct+0 >= threshold+0) }'

      # Push-only: PR runs shouldn't write commits. Writes a shields.io endpoint-schema
      # JSON badge and commits it back so READMEs can reference it via
      # img.shields.io/endpoint. continue-on-error since a badge push racing another
      # push to the same branch is a rejected, not fatal, non-fast-forward.
      - name: Coverage badge
        id: coverage_badge
        if: github.event_name == 'push' && matrix.entry.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
            | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+')
          PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
          COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > .github/badges/coverage.json
          if git diff --quiet -- .github/badges/coverage.json; then
            echo "Badge unchanged, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="coverage-badge/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add .github/badges/coverage.json
          git commit -m "chore: update coverage badge [skip ci]"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "chore: update coverage badge" \
            --body "Automated coverage badge update ($PCT%)." \
            --base "${{ github.ref_name }}" --head "$BRANCH")
          gh pr merge "$PR_URL" --squash --auto --delete-branch

      - name: Test (no default features)
        id: test_no_default_features
        if: inputs.no-default-features-test
        run: |
          cargo test --no-default-features

      - name: Test (doc)
        id: test_doc
        if: inputs.doc-test
        run: |
          cargo test --doc

      - name: Docs
        id: docs
        if: inputs.doc-build
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps
